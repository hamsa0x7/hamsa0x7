name: Tidal Monolith State

on:
  issues:
    types: [opened]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: shrine-state
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  mutate-shrine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update Shrine State
        id: update
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node -e '
            const fs = require("fs");
            const state = JSON.parse(fs.readFileSync("state.json", "utf8"));
            const states = ["calm", "surge", "eclipse"];
            let matched = "";
            if (process.env.EVENT_NAME === "issues") {
              const title = (process.env.ISSUE_TITLE || "").toLowerCase();
              const match = title.match(/shrine:(calm|surge|eclipse)/);
              if (!match) {
                console.log("Not a shrine command issue, skipping state mutation.");
                process.exit(0);
              }
              matched = match[1];
              state.state = matched;
              state.rituals += 1;
              state.lastActor = process.env.ISSUE_USER || "visitor";
            } else {
              const idx = states.indexOf(state.state);
              state.state = states[(idx + 1) % states.length];
            }
            state.updatedAt = new Date().toISOString();
            fs.writeFileSync("state.json", JSON.stringify(state, null, 2) + "\n");
            if (matched) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `matched=${matched}\n`);
            }
          '
          node scripts/update-shrine.mjs

      - name: Close Ritual Issue
        if: github.event_name == 'issues' && steps.update.outputs.matched != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `The shrine shifted to **${{ steps.update.outputs.matched }}**.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Commit Shrine State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json README.md assets/svg/
          if ! git diff --cached --quiet; then
            git commit -m "shrine: shift world state"
            git push
          fi

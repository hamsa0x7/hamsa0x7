<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>hamsa0x7 — Tidal Monolith Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from '../node_modules/three/build/three.module.js';

const params = new URLSearchParams(window.location.search);
const WIDTH = parseInt(params.get('w') || '900', 10);
const HEIGHT = parseInt(params.get('h') || '520', 10);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(WIDTH, HEIGHT, false);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, WIDTH / HEIGHT, 0.1, 200);

// Palette presets for Dual-Reality (light = Solar Mirage, dark = Nocturnal Submerged)
const THEMES = {
  light: {
    skyTop: new THREE.Color('#efe4cf'),
    skyHorizon: new THREE.Color('#f8f1e4'),
    fog: new THREE.Color('#f4ead7'),
    sunColor: new THREE.Color('#fff4dc'),
    ambient: new THREE.Color('#d8c7ab'),
    stone: new THREE.Color('#e6d9c3'),
    stoneDark: new THREE.Color('#b8a487'),
    dune: new THREE.Color('#dcc8a8'),
    duneShadow: new THREE.Color('#b09673'),
    waterDeep: new THREE.Color('#9fb7b3'),
    waterShallow: new THREE.Color('#d9e3dc'),
    waterSpec: new THREE.Color('#fff7e2'),
    accent: new THREE.Color('#c88a36'),
    accentEmissive: new THREE.Color('#7a4b10'),
    glyph: new THREE.Color('#8c5a1e'),
    starOpacity: 0.0,
    exposure: 1.05,
  },
  dark: {
    skyTop: new THREE.Color('#04070e'),
    skyHorizon: new THREE.Color('#0b1524'),
    fog: new THREE.Color('#08101c'),
    sunColor: new THREE.Color('#8fd3ff'),
    ambient: new THREE.Color('#1b2e47'),
    stone: new THREE.Color('#161d29'),
    stoneDark: new THREE.Color('#0b0f17'),
    dune: new THREE.Color('#111824'),
    duneShadow: new THREE.Color('#070b12'),
    waterDeep: new THREE.Color('#030811'),
    waterShallow: new THREE.Color('#0c2838'),
    waterSpec: new THREE.Color('#66e3ff'),
    accent: new THREE.Color('#4deeea'),
    accentEmissive: new THREE.Color('#18b8c9'),
    glyph: new THREE.Color('#3de0ff'),
    starOpacity: 1.0,
    exposure: 1.18,
  }
};

// Shared uniforms
const uTime = { value: 0 };
const uStateWave = { value: 1.0 };
const uThemeDark = { value: 0.0 };
const uSkyTop = { value: new THREE.Color() };
const uSkyHorizon = { value: new THREE.Color() };
const uWaterDeep = { value: new THREE.Color() };
const uWaterShallow = { value: new THREE.Color() };
const uWaterSpec = { value: new THREE.Color() };
const uDuneColor = { value: new THREE.Color() };
const uDuneShadow = { value: new THREE.Color() };

// 1. Procedural Sky Dome
const skyGeo = new THREE.SphereGeometry(95, 48, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    uTop: uSkyTop,
    uHorizon: uSkyHorizon,
    uDark: uThemeDark,
    uTime: uTime,
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 uTop;
    uniform vec3 uHorizon;
    uniform float uDark;
    uniform float uTime;
    varying vec3 vWorldPos;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y * 1.35 + 0.08, 0.0, 1.0);
      vec3 col = mix(uHorizon, uTop, pow(h, 0.72));

      // Subtle atmospheric band
      float band = exp(-abs(dir.y - 0.04) * 14.0);
      col += mix(vec3(0.12, 0.08, 0.03), vec3(0.03, 0.12, 0.18), uDark) * band * 0.55;

      // Subtle stars in dark mode
      if (uDark > 0.5 && dir.y > 0.02) {
        vec2 uv = dir.xz / (dir.y + 0.35) * 42.0;
        vec2 cell = floor(uv);
        vec2 f = fract(uv) - 0.5;
        float rnd = hash(cell);
        if (rnd > 0.965) {
          float d = length(f);
          float twinkle = 0.65 + 0.35 * sin(uTime + rnd * 40.0);
          float star = smoothstep(0.16, 0.0, d) * twinkle * smoothstep(0.02, 0.25, dir.y);
          col += vec3(0.65, 0.88, 1.0) * star * 0.85;
        }
      }

      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// 2. Celestial Disc / Eclipse Ring behind the monolith
const sunGroup = new THREE.Group();
sunGroup.position.set(0, 8.2, -26);
scene.add(sunGroup);

const celestialDisc = new THREE.Mesh(
  new THREE.CircleGeometry(4.4, 64),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92 })
);
sunGroup.add(celestialDisc);

const eclipseCore = new THREE.Mesh(
  new THREE.CircleGeometry(3.85, 64),
  new THREE.MeshBasicMaterial({ color: 0x050911 })
);
eclipseCore.position.z = 0.05;
sunGroup.add(eclipseCore);

const celestialHalo = new THREE.Mesh(
  new THREE.RingGeometry(4.5, 6.2, 64),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.16, side: THREE.DoubleSide })
);
celestialHalo.position.z = -0.05;
sunGroup.add(celestialHalo);

// 3. Sculpted Desert Dunes surrounding the water basin
const duneGeo = new THREE.PlaneGeometry(140, 140, 180, 180);
duneGeo.rotateX(-Math.PI / 2);
const posAttr = duneGeo.attributes.position;
for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i);
  const z = posAttr.getZ(i);
  const r = Math.sqrt(x * x + z * z);
  // Central flooded salt-flat basin (r < 14 stays submerged)
  const basinMask = THREE.MathUtils.smoothstep(r, 11.5, 24.0);
  const ridge1 = Math.abs(Math.sin(x * 0.09 + z * 0.05));
  const ridge2 = Math.sin(x * 0.04 - z * 0.08) * 0.5 + 0.5;
  const height = basinMask * (1.2 + ridge1 * 3.4 + ridge2 * 2.1) - (1.0 - basinMask) * 1.4;
  posAttr.setY(i, height);
}
duneGeo.computeVertexNormals();

const duneMat = new THREE.ShaderMaterial({
  uniforms: {
    uColor: uDuneColor,
    uShadow: uDuneShadow,
    uFog: scene.fog ? scene.fog.color : new THREE.Color(),
    uTime: uTime,
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    uniform vec3 uShadow;
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    void main() {
      vec3 lightDir = normalize(vec3(0.35, 0.72, -0.58));
      float diff = clamp(dot(normalize(vNormal), lightDir), 0.0, 1.0);
      // Wind-carved sand micro-ripples
      float ripple = sin(vWorldPos.x * 2.4 + vWorldPos.z * 0.9) * 0.04;
      vec3 col = mix(uShadow, uColor, clamp(diff + 0.22 + ripple, 0.0, 1.0));
      float dist = length(vWorldPos.xz);
      float fogF = smoothstep(24.0, 72.0, dist);
      col = mix(col, uShadow * 1.15, fogF * 0.65);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const dunes = new THREE.Mesh(duneGeo, duneMat);
scene.add(dunes);

// 4. Mirror Water Plane with Custom GLSL Ripple & Fresnel Shader
const waterGeo = new THREE.PlaneGeometry(120, 120, 180, 180);
waterGeo.rotateX(-Math.PI / 2);
const waterMat = new THREE.ShaderMaterial({
  transparent: true,
  side: THREE.DoubleSide,
  uniforms: {
    uTime: uTime,
    uWaveAmp: uStateWave,
    uDeep: uWaterDeep,
    uShallow: uWaterShallow,
    uSpec: uWaterSpec,
    uSkyTop: uSkyTop,
    uSkyHorizon: uSkyHorizon,
    uDark: uThemeDark,
  },
  vertexShader: `
    uniform float uTime;
    uniform float uWaveAmp;
    varying vec3 vWorldPos;
    varying float vWave;
    void main() {
      vec3 p = position;
      float r = length(p.xz);
      // Seamless periodic concentric ripples from the shrine
      float concentric = sin(r * 1.65 - uTime * 2.0) * exp(-r * 0.07) * 0.09 * uWaveAmp;
      float swell = sin(p.x * 0.45 + uTime) * cos(p.z * 0.45 - uTime) * 0.035 * uWaveAmp;
      p.y += concentric + swell;
      vWave = concentric + swell;
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uWaveAmp;
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform vec3 uSpec;
    uniform vec3 uSkyTop;
    uniform vec3 uSkyHorizon;
    uniform float uDark;
    varying vec3 vWorldPos;
    varying float vWave;

    void main() {
      float r = length(vWorldPos.xz);
      // Approximate normal from concentric wave derivative
      vec2 dir = r > 0.001 ? vWorldPos.xz / r : vec2(0.0);
      float dR = cos(r * 1.65 - uTime * 2.0) * 1.65 * exp(-r * 0.07) * 0.14 * uWaveAmp;
      vec3 N = normalize(vec3(-dir.x * dR, 1.0, -dir.y * dR));
      vec3 V = normalize(cameraPosition - vWorldPos);

      float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.2);
      vec3 skyRefl = mix(uSkyHorizon, uSkyTop, clamp(fresnel * 0.85, 0.0, 1.0));

      vec3 baseWater = mix(uShallow, uDeep, smoothstep(1.5, 13.0, r));
      vec3 col = mix(baseWater, skyRefl, clamp(fresnel * 0.82 + 0.12, 0.0, 0.94));

      // Sun/Moon reflection path across water
      vec3 L = normalize(vec3(0.0, 0.32, -1.0));
      vec3 H = normalize(L + V);
      float spec = pow(max(dot(N, H), 0.0), 96.0);
      col += uSpec * spec * 1.35;

      // Subtle glowing ripple crest in dark mode
      float crest = smoothstep(0.025, 0.08, vWave) * uDark;
      col += uSpec * crest * 0.45;

      // Fade alpha near distant shoreline
      float alpha = 0.94 - smoothstep(18.0, 32.0, r) * 0.35;
      gl_FragColor = vec4(col, clamp(alpha, 0.0, 0.96));
    }
  `
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = 0.0;
scene.add(water);

// 5. Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xffffff, 2.2);
mainLight.position.set(6, 12, -10);
mainLight.castShadow = true;
mainLight.shadow.mapSize.set(2048, 2048);
mainLight.shadow.camera.near = 1;
mainLight.shadow.camera.far = 45;
mainLight.shadow.camera.left = -14;
mainLight.shadow.camera.right = 14;
mainLight.shadow.camera.top = 14;
mainLight.shadow.camera.bottom = -14;
scene.add(mainLight);

const rimLight = new THREE.PointLight(0x4deeea, 0, 22);
rimLight.position.set(0, 3.2, 0);
scene.add(rimLight);

// 6. Shrine Materials
const stoneMat = new THREE.MeshStandardMaterial({ roughness: 0.78, metalness: 0.08 });
const stoneDarkMat = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0.14 });
const accentMat = new THREE.MeshStandardMaterial({ roughness: 0.25, metalness: 0.85 });
const glyphMat = new THREE.MeshStandardMaterial({ roughness: 0.3, metalness: 0.5, emissiveIntensity: 1.4 });

// 7. Build the Tidal Monolith Shrine
const shrine = new THREE.Group();
scene.add(shrine);

// Submerged & stepped plinths
const plinth1 = new THREE.Mesh(new THREE.CylinderGeometry(5.2, 5.8, 0.6, 8), stoneDarkMat);
plinth1.position.y = -0.15;
plinth1.receiveShadow = true;
shrine.add(plinth1);

const plinth2 = new THREE.Mesh(new THREE.CylinderGeometry(3.7, 4.1, 0.45, 8), stoneMat);
plinth2.position.y = 0.22;
plinth2.castShadow = true;
plinth2.receiveShadow = true;
shrine.add(plinth2);

// Glowing basin ring inlay
const basinRing = new THREE.Mesh(new THREE.TorusGeometry(3.45, 0.055, 16, 64), glyphMat);
basinRing.rotation.x = Math.PI / 2;
basinRing.position.y = 0.46;
shrine.add(basinRing);

// Twin Split Monolith Pillars forming an oculus arch
function createMonolithHalf(side) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.35, 6.2, 1.5), stoneMat);
  base.position.set(side * 1.45, 3.3, 0);
  base.castShadow = true;
  base.receiveShadow = true;
  g.add(base);

  // Tapered upper crown
  const crown = new THREE.Mesh(new THREE.BoxGeometry(1.05, 2.2, 1.25), stoneMat);
  crown.position.set(side * 1.15, 7.2, 0);
  crown.rotation.z = side * 0.14;
  crown.castShadow = true;
  g.add(crown);

  // Carved glowing vertical channel
  const channel = new THREE.Mesh(new THREE.BoxGeometry(0.12, 5.1, 1.56), glyphMat);
  channel.position.set(side * 1.45, 3.2, 0);
  g.add(channel);

  // Submerged root pillar (visible from underwater view!)
  const root = new THREE.Mesh(new THREE.BoxGeometry(1.2, 4.8, 1.3), stoneDarkMat);
  root.position.set(side * 1.45, -2.5, 0);
  g.add(root);

  const rootChannel = new THREE.Mesh(new THREE.BoxGeometry(0.14, 4.2, 1.36), glyphMat);
  rootChannel.position.set(side * 1.45, -2.5, 0);
  g.add(rootChannel);

  return g;
}
shrine.add(createMonolithHalf(-1));
shrine.add(createMonolithHalf(1));

// Floating architectural lintel/archway ring
const oculusRing = new THREE.Mesh(new THREE.TorusGeometry(2.05, 0.16, 18, 64), stoneMat);
oculusRing.position.set(0, 6.4, 0);
oculusRing.castShadow = true;
shrine.add(oculusRing);

// Orbiting Astrolabe Rings around the Relic
const ringOuter = new THREE.Mesh(new THREE.TorusGeometry(1.45, 0.045, 16, 64), accentMat);
ringOuter.position.set(0, 3.35, 0);
shrine.add(ringOuter);

const ringInner = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.035, 16, 64), glyphMat);
ringInner.position.set(0, 3.35, 0);
shrine.add(ringInner);

// Central Levitating Octahedral Relic
const relicGroup = new THREE.Group();
relicGroup.position.set(0, 3.35, 0);
shrine.add(relicGroup);

const relicCore = new THREE.Mesh(new THREE.OctahedronGeometry(0.62, 0), accentMat);
relicCore.castShadow = true;
relicGroup.add(relicCore);

const relicCage = new THREE.Mesh(
  new THREE.OctahedronGeometry(0.82, 0),
  new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.45 })
);
relicGroup.add(relicCage);

// Flanking Sunken Colonnade Steles + Floating Shards
const steleData = [
  [-6.2, -3.5, 3.2, 0.55],
  [6.2, -3.5, 3.6, -0.45],
  [-8.5, -7.2, 4.6, 0.3],
  [8.5, -7.2, 4.2, -0.35],
  [-4.4, 4.8, 1.8, 0.2],
  [4.4, 4.8, 2.1, -0.2],
];
const floatingShards = [];
for (const [sx, sz, sh, tilt] of steleData) {
  const stele = new THREE.Mesh(new THREE.BoxGeometry(0.65, sh, 0.65), stoneDarkMat);
  stele.position.set(sx, sh * 0.35 - 0.5, sz);
  stele.rotation.z = tilt * 0.12;
  stele.castShadow = true;
  stele.receiveShadow = true;
  shrine.add(stele);

  const shard = new THREE.Mesh(new THREE.OctahedronGeometry(0.24, 0), glyphMat);
  shard.position.set(sx, sh * 0.85 + 0.6, sz);
  shrine.add(shard);
  floatingShards.push({ mesh: shard, baseY: shard.position.y, phase: sx + sz });
}

// Underwater light shafts (visible in submerged view)
const shaftGroup = new THREE.Group();
const shaftMat = new THREE.MeshBasicMaterial({
  color: 0x66e3ff,
  transparent: true,
  opacity: 0.12,
  side: THREE.DoubleSide,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
for (let i = 0; i < 6; i++) {
  const angle = (i / 6) * Math.PI * 2;
  const shaft = new THREE.Mesh(new THREE.ConeGeometry(1.1, 6.5, 16, 1, true), shaftMat);
  shaft.position.set(Math.cos(angle) * 2.2, -2.6, Math.sin(angle) * 2.2);
  shaft.rotation.z = Math.sin(angle) * 0.18;
  shaftGroup.add(shaft);
}
shrine.add(shaftGroup);

// Camera Presets for the 4 Views
const VIEWS = {
  main: {
    pos: (t) => [Math.sin(t) * 0.55, 2.55 + Math.sin(t) * 0.08, 14.6],
    look: [0, 3.55, 0],
    fov: 42,
  },
  sanctum: {
    pos: (t) => [Math.sin(t) * 0.25, 1.35, 3.55],
    look: [0, 4.35, -1.5],
    fov: 54,
  },
  submerged: {
    pos: (t) => [Math.sin(t) * 0.45, -2.25 + Math.cos(t) * 0.06, 10.4],
    look: [0, -0.5, 0],
    fov: 52,
  },
  relic: {
    pos: (t) => [Math.sin(t) * 0.35, 3.55, 3.35],
    look: [0, 3.35, 0],
    fov: 38,
  }
};

function applyConfig(themeName, stateName, viewName) {
  const th = THEMES[themeName] || THEMES.dark;
  const isDark = themeName === 'dark';

  renderer.toneMappingExposure = th.exposure;
  uThemeDark.value = isDark ? 1.0 : 0.0;
  uSkyTop.value.copy(th.skyTop);
  uSkyHorizon.value.copy(th.skyHorizon);
  uWaterDeep.value.copy(th.waterDeep);
  uWaterShallow.value.copy(th.waterShallow);
  uWaterSpec.value.copy(th.waterSpec);
  uDuneColor.value.copy(th.dune);
  uDuneShadow.value.copy(th.duneShadow);

  ambientLight.color.copy(th.ambient);
  mainLight.color.copy(th.sunColor);
  mainLight.intensity = isDark ? 1.5 : 2.5;
  rimLight.color.copy(th.accent);
  rimLight.intensity = isDark ? 4.5 : 0.8;

  stoneMat.color.copy(th.stone);
  stoneDarkMat.color.copy(th.stoneDark);
  accentMat.color.copy(th.accent);
  accentMat.emissive.copy(th.accentEmissive);
  accentMat.emissiveIntensity = isDark ? 0.85 : 0.15;

  glyphMat.color.copy(th.glyph);
  glyphMat.emissive.copy(th.glyph);
  glyphMat.emissiveIntensity = isDark ? 1.9 : 0.15;

  relicCage.material.color.copy(th.accent);
  shaftMat.color.copy(isDark ? th.accent : th.waterSpec);
  shaftMat.opacity = isDark ? 0.14 : 0.09;

  // World state modifiers: calm, surge, eclipse
  if (stateName === 'eclipse') {
    uStateWave.value = 1.35;
    celestialDisc.material.color.copy(isDark ? new THREE.Color('#66e3ff') : new THREE.Color('#d97a2b'));
    eclipseCore.visible = true;
    sunGroup.position.set(0, 6.5, -24);
    sunGroup.scale.setScalar(1.35);
    celestialHalo.material.opacity = 0.34;
  } else if (stateName === 'surge') {
    uStateWave.value = 2.15;
    celestialDisc.material.color.copy(isDark ? new THREE.Color('#bfe8ff') : new THREE.Color('#fff5dc'));
    eclipseCore.visible = isDark;
    sunGroup.position.set(0, 8.2, -26);
    sunGroup.scale.setScalar(1.0);
    celestialHalo.material.opacity = 0.22;
  } else {
    uStateWave.value = 1.0;
    celestialDisc.material.color.copy(isDark ? new THREE.Color('#9ad7ff') : new THREE.Color('#fff5dc'));
    eclipseCore.visible = isDark;
    sunGroup.position.set(0, 8.2, -26);
    sunGroup.scale.setScalar(0.92);
    celestialHalo.material.opacity = 0.14;
  }

  const v = VIEWS[viewName] || VIEWS.main;
  camera.fov = v.fov;
  camera.updateProjectionMatrix();
}

// Deterministic seamless loop renderer for Playwright
window.renderSceneFrame = function(progress, themeName, stateName, viewName) {
  applyConfig(themeName, stateName, viewName);
  const t = progress * Math.PI * 2; // Exact 2pi period for seamless loop
  uTime.value = t;

  const speedMult = stateName === 'surge' ? 2 : 1;

  // Relic levitation & rotation (integer multiples of 2pi)
  relicGroup.position.y = 3.35 + Math.sin(t) * (stateName === 'eclipse' ? 0.32 : 0.18);
  relicCore.rotation.y = t * speedMult;
  relicCore.rotation.x = Math.sin(t) * 0.25;
  relicCage.rotation.y = -t * speedMult;
  relicCage.rotation.z = Math.cos(t) * 0.2;

  // Astrolabe rings
  ringOuter.rotation.x = Math.PI * 0.32 + Math.sin(t) * 0.22;
  ringOuter.rotation.y = t * speedMult;
  ringInner.rotation.z = t * speedMult;
  ringInner.rotation.x = Math.cos(t) * 0.35;

  // Floating shards
  for (const s of floatingShards) {
    const lift = stateName === 'eclipse' ? 0.45 : 0.16;
    s.mesh.position.y = s.baseY + Math.sin(t + s.phase) * lift;
    s.mesh.rotation.y = t + s.phase;
  }

  const v = VIEWS[viewName] || VIEWS.main;
  const [cx, cy, cz] = v.pos(t);
  camera.position.set(cx, cy, cz);
  camera.lookAt(...v.look);

  renderer.render(scene, camera);
};

// Initial preview render if opened manually
const initTheme = params.get('theme') || 'dark';
const initState = params.get('state') || 'calm';
const initView = params.get('view') || 'main';
window.renderSceneFrame(0, initTheme, initState, initView);
</script>
</body>
</html>
